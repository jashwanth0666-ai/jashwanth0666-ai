<svg
    width="1600"
    height="500"
    viewBox="0 0 1600 500"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- ================= Background ================= -->

<linearGradient id="bgGradient"
    x1="0"
    y1="0"
    x2="1600"
    y2="500"
    gradientUnits="userSpaceOnUse">

    <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color"
                 values="#0D1117;#111827;#0D1117"
                 dur="10s"
                 repeatCount="indefinite"/>
    </stop>

    <stop offset="100%" stop-color="#161B22">
        <animate attributeName="stop-color"
                 values="#161B22;#1F2937;#161B22"
                 dur="10s"
                 repeatCount="indefinite"/>
    </stop>

</linearGradient>

<!-- ================= Blue Glow ================= -->

<radialGradient id="blueGlow">

    <stop offset="0%"
          stop-color="#38BDF8"
          stop-opacity="0.9"/>

    <stop offset="100%"
          stop-color="#38BDF8"
          stop-opacity="0"/>

</radialGradient>

<!-- ================= Purple Glow ================= -->

<radialGradient id="purpleGlow">

    <stop offset="0%"
          stop-color="#8B5CF6"
          stop-opacity="0.8"/>

    <stop offset="100%"
          stop-color="#8B5CF6"
          stop-opacity="0"/>

</radialGradient>

<!-- ================= Text Glow ================= -->

<filter id="textGlow">

    <feGaussianBlur stdDeviation="4"
                    result="blur"/>

    <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>

</filter>

</defs>

<!-- ================= Background ================= -->

<rect
    width="1600"
    height="500"
    fill="url(#bgGradient)"/>

<!-- ================= Animated Glow ================= -->

<circle
    cx="250"
    cy="120"
    r="140"
    fill="url(#blueGlow)">

<animate
attributeName="r"
values="130;160;130"
dur="7s"
repeatCount="indefinite"/>

</circle>

<circle
    cx="1350"
    cy="370"
    r="180"
    fill="url(#purpleGlow)">

<animate
attributeName="r"
values="170;200;170"
dur="9s"
repeatCount="indefinite"/>

</circle>

<!-- ================= Circuit Lines ================= -->

<g
stroke="#38BDF8"
stroke-width="2"
stroke-opacity="0.20"
fill="none">

<path d="M0 100 H340 L430 200 H760"/>

<path d="M1600 340 H1260 L1160 250 H900"/>

<path d="M200 500 V330 H460"/>

<path d="M1450 0 V150 H1220"/>

</g>

<!-- ================= AI Nodes ================= -->

<g fill="#38BDF8">

<circle cx="340" cy="100" r="5">
<animate
attributeName="r"
values="5;8;5"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="430" cy="200" r="5">
<animate
attributeName="r"
values="5;8;5"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="1160" cy="250" r="5">
<animate
attributeName="r"
values="5;8;5"
dur="2.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="1260" cy="340" r="5">
<animate
attributeName="r"
values="5;8;5"
dur="4s"
repeatCount="indefinite"/>
</circle>

</g>

<!-- ================= Name ================= -->

<text
x="800"
y="170"
text-anchor="middle"
font-size="58"
font-family="Space Grotesk, Arial"
font-weight="700"
fill="#F8FAFC"
filter="url(#textGlow)">

JASHWANTH SAI

</text>

<!-- ================= Subtitle ================= -->

<text
x="800"
y="225"
text-anchor="middle"
font-size="28"
font-family="Inter, Arial"
fill="#38BDF8">

Backend Engineer • AI Developer • Cybersecurity Enthusiast

</text>

<!-- ================= Tagline ================= -->

<text
x="800"
y="275"
text-anchor="middle"
font-size="22"
font-family="Inter, Arial"
fill="#C9D1D9">
Building Secure, Scalable &amp; Intelligent Software

</text>

<!-- ================= Tech Stack ================= -->

<text
x="800"
y="335"
text-anchor="middle"
font-size="18"
font-family="JetBrains Mono, monospace"
fill="#8B5CF6">

Laravel • PHP • Java • Python • React • PostgreSQL

</text>

</svg>