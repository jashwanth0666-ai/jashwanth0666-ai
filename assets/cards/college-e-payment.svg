  <rect x="80" y="430" width="1040" height="120" rx="24" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="130" y="460" width="120" height="60" rx="16" fill="#38BDF8"/>
  <rect x="280" y="460" width="120" height="60" rx="16" fill="#8B5CF6"/>
