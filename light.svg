<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luxury light profile banner for Jashwanth Sai">
  <defs>
    <!-- Luxury background -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCF8EE">
        <animate attributeName="stop-color" values="#FCF8EE;#F6EEDB;#FCF8EE" dur="16s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#EFE3C9">
        <animate attributeName="stop-color" values="#EFE3C9;#F5EAD4;#EFE3C9" dur="16s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A441" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#C9A441" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldStroke" x1="500" y1="80" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B5A17" />
      <stop offset="40%" stop-color="#A88428" />
      <stop offset="100%" stop-color="#D3B15A" />
    </linearGradient>

    <linearGradient id="cardFill" x1="520" y1="92" x2="1080" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.56" />
    </linearGradient>

    <linearGradient id="scanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="scanEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0" />
      <stop offset="45%" stop-color="#BAE6FD" stop-opacity="0.92" />
      <stop offset="55%" stop-color="#BAE6FD" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="luxBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#D3B15A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <pattern id="sciGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0EA5E9" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <!-- Depth and glow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6B4E1A" flood-opacity="0.2" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="auraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" />
    </filter>

    <!-- Reusable network line -->
    <g id="networkLine" stroke="#A88428" stroke-opacity="0.25" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 110 H290 L375 190 H700" />
      <path d="M1600 330 H1310 L1225 250 H930" />
      <path d="M190 500 V340 H470" />
      <path d="M1455 0 V150 H1240" />
    </g>

    <!-- Reusable node -->
    <g id="networkNode">
      <circle cx="0" cy="0" r="5" fill="#A88428">
        <animate attributeName="r" values="5;7.2;5" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="#A88428" fill-opacity="0.14">
        <animate attributeName="r" values="14;18;14" dur="3.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <clipPath id="cardClip">
      <rect x="532" y="104" width="536" height="292" rx="22" />
    </clipPath>

    <mask id="scanMask" maskUnits="userSpaceOnUse" x="532" y="104" width="536" height="292">
      <rect x="532" y="104" width="536" height="292" fill="black" />
      <rect x="460" y="104" width="170" height="292" fill="url(#scanBeam)">
        <animate id="scanSweep" attributeName="x" values="460;980;460" dur="8s" repeatCount="indefinite" />
      </rect>
      <rect x="450" y="104" width="34" height="292" fill="url(#scanEdge)">
        <animate id="scanEdgeSweep" attributeName="x" values="450;1010;450" dur="8s" repeatCount="indefinite" />
      </rect>
    </mask>
  </defs>

  <!-- Base layer -->
  <rect width="1600" height="500" fill="url(#bgGradient)" />
  <rect width="1600" height="500" fill="url(#sciGrid)" opacity="0.20" />
  <rect x="-120" y="40" width="820" height="120" transform="rotate(-9 0 0)" fill="url(#luxBand)" opacity="0.18" />
  <rect x="780" y="330" width="760" height="120" transform="rotate(-8 780 330)" fill="url(#luxBand)" opacity="0.15" />

  <!-- Soft auras -->
  <circle cx="250" cy="120" r="180" fill="url(#goldAura)" filter="url(#auraBlur)">
    <animate attributeName="r" values="165;195;165" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="1340" cy="360" r="210" fill="url(#goldAura)" filter="url(#auraBlur)">
    <animate attributeName="r" values="195;230;195" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- Floating particles -->
  <g opacity="0.95" fill="#8A6B1F">
    <circle cx="110" cy="78" r="1.8">
      <animate attributeName="cy" values="78;65;78" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="6.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="390" r="2.2">
      <animate attributeName="cy" values="390;376;390" dur="7.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.24;0.74;0.24" dur="7.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1210" cy="116" r="2.1">
      <animate attributeName="cy" values="116;102;116" dur="8.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.22;0.7;0.22" dur="8.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="1470" cy="245" r="1.9">
      <animate attributeName="cy" values="245;233;245" dur="6.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.68;0.2" dur="6.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Network -->
  <use href="#networkLine" />
  <use href="#networkNode" transform="translate(290 110)" />
  <use href="#networkNode" transform="translate(375 190)" />
  <use href="#networkNode" transform="translate(1225 250)" />
  <use href="#networkNode" transform="translate(1310 330)" />

  <!-- Luxury frame -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="92" width="560" height="316" rx="30" fill="url(#cardFill)" stroke="url(#goldStroke)" stroke-opacity="0.84" />
    <rect x="532" y="104" width="536" height="292" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" />
  </g>

  <!-- HUD corner markers -->
  <g stroke="#0EA5E9" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M550 116 H584 M550 116 V150" />
    <path d="M1050 116 H1016 M1050 116 V150" />
    <path d="M550 384 H584 M550 384 V350" />
    <path d="M1050 384 H1016 M1050 384 V350" />
  </g>

  <!-- ASCII scanning overlay -->
  <g clip-path="url(#cardClip)">
    <g mask="url(#scanMask)" opacity="0.9" fill="#0C4A6E" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="1.1">
      <text x="548" y="138">[SCAN_INIT] 01001010 01100001 01110011 01101000 01110111 01100001 01101110 01110100 01101000</text>
      <text x="548" y="162">[NODE_BACKEND] 01100010 01100001 01100011 01101011 01100101 01101110 01100100 01011111 01110011</text>
      <text x="548" y="186">[NODE_SECURE] 01100011 01110101 01110010 01100101 01011111 01100011 01101111 01100100 01100101</text>
      <text x="548" y="210">[NODE_AI] 01100001 01101001 01011111 01100100 01100101 01110110 01011111 01110011 01111001 01110011</text>
      <text x="548" y="234">[LATENCY] 006ms [AUTH] PASS [TLS] ACTIVE [ANOMALY] 0.002</text>
      <text x="548" y="258">[THREAT_MAP] SAFE SAFE SAFE SAFE WATCH SAFE SAFE SAFE</text>
      <animateTransform attributeName="transform" type="translate" values="-120 0;120 0;-120 0" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.78;0.9;0.72;0.9;0.82" dur="0.45s" repeatCount="indefinite" />
    </g>
    <rect x="460" y="104" width="170" height="292" fill="url(#scanBeam)" opacity="0.18">
      <animate attributeName="x" values="460;980;460" dur="8s" repeatCount="indefinite" begin="scanSweep.begin" />
    </rect>
    <rect x="450" y="104" width="34" height="292" fill="url(#scanEdge)" opacity="0.26">
      <animate attributeName="x" values="450;1010;450" dur="8s" repeatCount="indefinite" begin="scanEdgeSweep.begin" />
    </rect>

  </g>

  <!-- Signature text -->
  <text x="800" y="170" text-anchor="middle" font-size="58" textLength="420" lengthAdjust="spacingAndGlyphs" font-family="Cinzel, Georgia, Times New Roman, serif" font-weight="700" letter-spacing="1" fill="#5F4610" filter="url(#textGlow)">Jashwanth Sai</text>
  <text x="800" y="224" text-anchor="middle" font-size="21" textLength="500" lengthAdjust="spacingAndGlyphs" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" fill="#0369A1">Backend Engineer • AI Developer • Cybersecurity Enthusiast</text>
  <text x="800" y="266" text-anchor="middle" font-size="19" textLength="460" lengthAdjust="spacingAndGlyphs" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#6F5720">Building Secure, Scalable &amp; Intelligent Software.</text>

  <!-- Elegant divider -->
  <path d="M665 307 H935" stroke="url(#goldStroke)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="800" cy="307" r="5" fill="#8A6B1F" />

  <!-- Stack label -->
  <text x="800" y="350" text-anchor="middle" font-size="16" textLength="440" lengthAdjust="spacingAndGlyphs" font-family="JetBrains Mono, Consolas, monospace" fill="#7C5E1D">Laravel • PHP • Java • Python • React • PostgreSQL</text>
</svg>