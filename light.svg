<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Light profile banner for Jashwanth Sai">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC">
        <animate attributeName="stop-color" values="#F8FAFC;#EFF6FF;#F8FAFC" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#E2E8F0">
        <animate attributeName="stop-color" values="#E2E8F0;#F1F5F9;#E2E8F0" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGradient" x1="560" y1="110" x2="1040" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45" />
    </linearGradient>

    <!-- Glow and blur filters -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>

    <filter id="blur40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Circuit pattern -->
    <g id="circuitLine" stroke="#0F172A" stroke-opacity="0.16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 100 H300 L380 180 H700" />
      <path d="M1600 340 H1290 L1210 260 H940" />
      <path d="M220 500 V340 H500" />
      <path d="M1450 0 V140 H1220" />
    </g>

    <!-- Node symbol -->
    <g id="node">
      <circle cx="0" cy="0" r="6" fill="#38BDF8">
        <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="16" fill="#8B5CF6" fill-opacity="0.10">
        <animate attributeName="r" values="14;20;14" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>
  </defs>

  <!-- Base background -->
  <rect width="1600" height="500" fill="url(#bgGradient)" />

  <!-- Ambient glows -->
  <circle cx="220" cy="110" r="170" fill="url(#blueGlow)" filter="url(#blur40)">
    <animate attributeName="r" values="155;185;155" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1370" cy="360" r="210" fill="url(#purpleGlow)" filter="url(#blur40)">
    <animate attributeName="r" values="190;225;190" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Floating particles -->
  <g opacity="0.8">
    <circle cx="120" cy="80" r="2" fill="#0F172A">
      <animate attributeName="cy" values="80;68;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="310" cy="390" r="2.5" fill="#38BDF8">
      <animate attributeName="cy" values="390;378;390" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1220" cy="110" r="2.5" fill="#8B5CF6">
      <animate attributeName="cy" values="110;96;110" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1460" cy="240" r="2" fill="#22C55E">
      <animate attributeName="cy" values="240;228;240" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="5.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Circuit network -->
  <use href="#circuitLine" />
  <g transform="translate(0 0)">
    <use href="#node" transform="translate(300 100)" />
    <use href="#node" transform="translate(380 180)" />
    <use href="#node" transform="translate(1210 260)" />
    <use href="#node" transform="translate(1290 340)" />
  </g>

  <!-- Glass card -->
  <g filter="url(#softShadow)">
    <rect x="520" y="92" width="560" height="316" rx="28" fill="url(#cardGradient)" stroke="#0F172A" stroke-opacity="0.10" />
    <rect x="520" y="92" width="560" height="316" rx="28" fill="none" stroke="#38BDF8" stroke-opacity="0.10" />
  </g>

  <!-- Hero text -->
  <text x="800" y="170" text-anchor="middle" font-size="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" fill="#0F172A" filter="url(#textGlow)">Jashwanth Sai</text>
  <text x="800" y="220" text-anchor="middle" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#38BDF8">Backend Engineer • AI Developer • Cybersecurity Enthusiast</text>
  <text x="800" y="268" text-anchor="middle" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#334155">Building Secure, Scalable &amp; Intelligent Software.</text>

  <!-- Accent bar -->
  <rect x="665" y="300" width="270" height="4" rx="2" fill="#8B5CF6" />
  <rect x="710" y="312" width="180" height="4" rx="2" fill="#38BDF8" />
  <rect x="745" y="324" width="110" height="4" rx="2" fill="#22C55E" />

  <!-- Stack line -->
  <text x="800" y="360" text-anchor="middle" font-size="18" font-family="JetBrains Mono, Consolas, monospace" fill="#5B21B6">Laravel • PHP • Java • Python • React • PostgreSQL</text>
</svg>